<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>店铺停留时长统一标注入口</title>
<style>body{font:15px system-ui,sans-serif;color:#263d48;background:#f5f7f8;max-width:1450px;margin:28px auto;padding:0 20px}p{line-height:1.7}h1{font-size:27px}h2{font-size:20px}table{background:white;border-collapse:collapse;width:100%}td,th{padding:10px;text-align:left;border-bottom:1px solid #dbe2e6}button,input,select{padding:9px 12px;margin:4px;border:1px solid #afbdc6;background:white;border-radius:5px}button{cursor:pointer}a{color:#245d7a}.pair{display:grid;grid-template-columns:1fr 1fr;gap:18px}.photos{display:flex;flex-wrap:wrap;gap:8px}.photos figure{width:120px;margin:0}.photos img{width:120px;height:250px;object-fit:contain;background:#eee}video{width:100%}#evidence{background:white;padding:18px;margin-top:20px}#evidence:empty{display:none}.muted{color:#64757e}@media(max-width:800px){.pair{grid-template-columns:1fr}}</style>
<h1>店铺停留时长统一标注入口</h1><p>同一组进出只出现一次；不同方法的来源合在同一行。已有标注保留，默认先看未标注记录。0＝不同人，1＝同一个人，2＝看不清或无法判断。</p>
<p><a href="统一标注表.xlsx">Excel标注表</a> · <a href="统一标注表.csv">同表CSV</a> · <a href="模型标注任务.jsonl">模型任务及证据路径</a></p>
<select id="state" onchange="refresh()"><option value="new">未标注</option><option value="conflict">历史标注有分歧</option><option value="2">已有2</option><option value="1">已有1</option><option value="0">已有0</option><option value="all">全部</option></select>
<select id="use" onchange="refresh()"><option value="all">全部用途</option><option>停留候选</option><option>短停留竞争</option></select><input id="search" placeholder="配对编号或事件编号" oninput="refresh()"><p id="count"></p><button onclick="move(-1)">上一页</button><button onclick="move(1)">下一页</button>
<table><thead><tr><th>配对编号</th><th>进入</th><th>出店</th><th>停留</th><th>已有标注</th><th>来源</th><th>证据</th></tr></thead><tbody id="list"></tbody></table><div id="evidence"></div>
<script>
const rows=/*DATA_ROWS*/,endpoints=/*DATA_ENDPOINTS*/;let page=0,filtered=[];
function stamp(t){t=Math.round(t);return [Math.floor(t/3600),Math.floor(t%3600/60),t%60].map(x=>String(x).padStart(2,'0')).join(':')}
function refresh(){const s=document.getElementById('state').value,u=document.getElementById('use').value,q=document.getElementById('search').value.trim().toUpperCase();filtered=rows.filter(r=>(s==='all'||(s==='new'?!r.current_label&&!r.needs_label_resolution:s==='conflict'?r.needs_label_resolution:r.current_label===s))&&(u==='all'||r.record_use===u)&&(!q||r.pair_id.includes(q)||String(r.entry_event)===q||String(r.exit_event)===q));page=0;draw()}
function move(d){page=Math.max(0,Math.min(Math.max(0,Math.ceil(filtered.length/50)-1),page+d));draw()}
function draw(){document.getElementById('count').textContent=`${filtered.length} 条，第 ${page+1}/${Math.max(1,Math.ceil(filtered.length/50))} 页`;document.getElementById('list').innerHTML=filtered.slice(page*50,page*50+50).map(r=>`<tr><td>${r.pair_id}</td><td>${stamp(r.entry_seconds)}</td><td>${stamp(r.exit_seconds)}</td><td>${stamp(r.exit_seconds-r.entry_seconds)}</td><td>${r.current_label||r.historical_label_display||'未标注'}</td><td>${r.source_methods.join('、')}</td><td><button onclick="location.hash='${r.pair_id}'">查看</button></td></tr>`).join('')}
function end(e,label){return `<section><h2>${label} · 事件 ${e.event_id}</h2><p class="muted">${e.crossing_confirmed_by_human===false?'新补入口，需同时核对进店动作':''}</p>${e.videos.map(v=>`<p>片段 ${v.fragment+1}</p><video controls preload="none" src="${v.path}"></video>`).join('')}<div class="photos">${e.views.map(v=>`<figure><a href="${v.crop}" target="_blank"><img loading="lazy" src="${v.crop}"></a><figcaption>${v.cell} ${stamp(v.time)} <a href="${v.context}" target="_blank">原画面</a></figcaption></figure>`).join('')}</div></section>`}
function alternatives(ids){return ids.slice(0,40).map(k=>`<a href="#${k}">${k}</a>`).join('　')+(ids.length>40?` 等${ids.length}组（完整编号在JSONL中）`:'')}
function show(){const id=decodeURIComponent(location.hash.slice(1)),r=rows.find(x=>x.pair_id===id);if(!r)return;const box=document.getElementById('evidence');box.innerHTML=`<h2>${id}　${stamp(r.entry_seconds)} → ${stamp(r.exit_seconds)}</h2><p>${r.record_use}。${r.new_entry_proposal?'这是补回入口形成的新配法。':''}</p><details><summary>共用这次进店：另外${r.entry_alternatives.length}种配法；共用这次出店：另外${r.exit_alternatives.length}种配法</summary><p>${alternatives(r.entry_alternatives)}</p><p>${alternatives(r.exit_alternatives)}</p></details><div class="pair">${end(endpoints[r.entry_event],'进店')}${end(endpoints[r.exit_event],'出店')}</div>`;box.scrollIntoView()}
window.addEventListener('hashchange',show);refresh();show();
</script></html>
